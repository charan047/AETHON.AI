[pytest]
asyncio_mode = auto
testpaths = tests
timeout = 60
addopts =
  --cov=.
  --cov-report=term-missing
  --cov-report=html:coverage_report
  --cov-fail-under=70
  -v
  --tb=short
filterwarnings =
  ignore::DeprecationWarning
markers =
  integration: tests that make real external calls or exercise end-to-end integration paths
